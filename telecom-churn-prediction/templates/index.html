<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom Churn Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Welcome Section -->
    <section id="welcome-section">
        <div class="welcome-content">
            <h1>Welcome to Telecom Churn Predictor</h1>
            <p>Find out whether a customer is likely to churn based on their details.</p>
            <button id="start-btn">Get Started</button>
        </div>
    </section>

    <!-- Main Form Section -->
    <div class="container" id="main-content">
        <h1>Customer Churn Prediction</h1>

        <form id="prediction-form">
            <div class="form-row">
                <!-- Column 1 -->
                <div class="form-column">
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Senior Citizen</label>
                        <select name="SeniorCitizen" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Partner</label>
                        <select name="Partner" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dependents</label>
                        <select name="Dependents" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tenure (months)</label>
                        <input type="number" name="tenure" min="0" max="100" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Service</label>
                        <select name="PhoneService" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                </div>

                <!-- Column 2 -->
                <div class="form-column">
                    <div class="form-group">
                        <label>Multiple Lines</label>
                        <select name="MultipleLines" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No phone service">No phone service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Internet Service</label>
                        <select name="InternetService" required>
                            <option value="DSL">DSL</option>
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Online Security</label>
                        <select name="OnlineSecurity" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Online Backup</label>
                        <select name="OnlineBackup" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Device Protection</label>
                        <select name="DeviceProtection" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tech Support</label>
                        <select name="TechSupport" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                </div>

                <!-- Column 3 -->
                <div class="form-column">
                    <div class="form-group">
                        <label>Streaming TV</label>
                        <select name="StreamingTV" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Streaming Movies</label>
                        <select name="StreamingMovies" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Contract</label>
                        <select name="Contract" required>
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Paperless Billing</label>
                        <select name="PaperlessBilling" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <select name="PaymentMethod" required>
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Monthly Charges ($)</label>
                        <input type="number" step="0.01" name="MonthlyCharges" required>
                    </div>

                    <div class="form-group">
                        <label>Total Charges ($)</label>
                        <input type="number" step="0.01" name="TotalCharges" required>
                    </div>
                </div>
            </div>

            <button type="submit">Predict Churn</button>
        </form>

        <div id="result" class="hidden">
            <h2>Prediction Result</h2>
            <p><strong>Status:</strong> <span id="prediction-text"></span></p>
            <p><strong>Probability:</strong> <span id="probability-text"></span>%</p>
        </div>
    </div>

    <script>
        // Smooth scroll and hide welcome section
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => {
                document.getElementById('welcome-section').style.display = 'none';
            }, 1000);
        });

        // Handle form submission
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.error) {
                alert('Error: ' + result.error);
            } else {
                document.getElementById('prediction-text').textContent = result.prediction;
                document.getElementById('probability-text').textContent = result.probability;
                document.getElementById('result').classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
